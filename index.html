<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>topper. — VFX & Motion Graphics Studio</title>
<link rel="icon" type="image/svg+xml" href="assets/topper_icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
@font-face {
  font-family: 'Futura Now Headline';
  src: url('assets/fonts/FuturaNowHeadlineBold.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black:   #111111;
  --white:   #FAFAF8;
  --ink:     rgba(17,17,17,0.82);
  --gray:    rgba(17,17,17,0.4);
  --hairline: rgba(17,17,17,0.1);

  /* topper. brand palette */
  --coral:   #FBAE9C;
  --sky:     #81CFE3;
  --yellow:  #FFC718;
  --blue:    #2F77B1;
  --red:     #E02727;
  --green:   #2A7928;
  --paper:   #EEEEEE;

  --accent:  var(--coral); /* current section accent, updated by JS */
  --pad:     clamp(1.25rem, 4vw, 2.5rem);   /* universal side padding */

  /* the topper mark — clip-path traced directly from topper_icon.svg
     (crown, flared brim, and the concave shoulder notches). Every UI
     icon that uses var(--t-mark) inherits this exact silhouette. */
  --t-mark: polygon(74.8% 58.6%, 74.2% 0%, 25.2% 0%, 25.2% 58.7%, 23.4% 61.4%, 21.8% 61.6%, 3.9% 58.2%, 0.8% 59%, 0% 99.6%, 100% 99.5%, 100% 62.1%, 99.1% 58.9%, 96% 58.2%, 78.1% 61.6%, 75.3% 60.3%, 74.8% 58.6%);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #FFFFFF;
  color: var(--black);
  font-family: 'Space Mono', monospace;
  touch-action: none;
}

::selection { background: var(--accent); color: var(--black); }

/* ── CANVAS — fills entire screen, always behind UI ── */
#canvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  z-index: 1;
}
#canvas:active { cursor: grabbing; }

/* ── GRID RULES ── */
.rule { position: fixed; pointer-events: none; z-index: 3; background: var(--hairline); }
.rule-top    { top: 5.5rem; left: 0; right: 0; height: 1px; }
.rule-bottom { bottom: 5rem; left: 0; right: 0; height: 1px; }

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 20;
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 1.4rem var(--pad) 0;
  height: 5.5rem;
  border-bottom: 1px solid var(--hairline);
  pointer-events: none;
}
nav > * { pointer-events: auto; }

.logo {
  display: flex;
  align-items: center;
  padding-bottom: 0.45rem;
}
.logo svg {
  height: clamp(1.1rem, 2.2vw, 1.5rem);
  width: auto;
  display: block;
}
.nav-contact {
  font-size: clamp(0.55rem, 1.1vw, 0.65rem);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gray);
  text-decoration: none;
  padding-bottom: 0.45rem;
  transition: color 0.3s ease;
}
.nav-contact:hover { color: var(--accent); }

/* ── BOTTOM BAR ── */
#bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 20;
  height: 5rem;
  border-top: 1px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--pad);
  pointer-events: none;
}
#bottom-bar > * { pointer-events: auto; }

.hint {
  font-size: clamp(0.5rem, 1vw, 0.6rem);
  letter-spacing: 0.12em;
  color: var(--gray);
}

/* Section dots — tiny topper "T" marks instead of circles */
.dots { display: flex; gap: 0.85rem; align-items: center; }
.dot {
  width: 10px; height: 9px;
  clip-path: var(--t-mark);
  background: rgba(17,17,17,0.18);
  transition: background 0.3s, transform 0.3s;
  cursor: pointer;
}
.dot.active { background: var(--accent); transform: scale(1.55); }
.dot:hover:not(.active) { background: rgba(17,17,17,0.45); }

/* ════════════════════════════════════════════
   CONTENT LAYER — sits above canvas (z:10)
   Left ~55% → text | Right ~45% → model shows through
   ════════════════════════════════════════════ */
#content {
  position: fixed;
  top: 5.5rem; bottom: 5rem;
  left: 0; right: 0;
  z-index: 10;
  pointer-events: none;
  display: grid;
  grid-template-columns: minmax(0, 55%) 1fr;
  grid-template-rows: auto 1fr auto;
  padding: 0 var(--pad);
  gap: 0;
}

/* ── TOP-LEFT: face index label + big title ── */
#face-index {
  grid-column: 1;
  grid-row: 1;
  padding-top: clamp(1.5rem, 3vh, 2.5rem);
}
#fi-title {
  font-family: 'Futura Now Headline', sans-serif;
  font-weight: 700;
  font-size: clamp(3.5rem, 8vw, 7rem);
  line-height: 0.88;
  letter-spacing: -0.01em;
  color: var(--black);
  max-width: 130%;
}

/* spacer row — pushes body text to bottom */
#spacer { grid-column: 1; grid-row: 2; }

/* ── BOTTOM-LEFT: body copy ── */
#face-text {
  grid-column: 1;
  grid-row: 3;
  padding-bottom: clamp(1.2rem, 2.5vh, 2rem);
  width: min(100%, 48vw);
  position: relative;
  min-height: 5rem;
}

.fblock {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  will-change: opacity, transform;
}
.fblock.visible {
  opacity: 1;
  transform: translateY(0);
}

.fblock-body {
  font-size: clamp(0.7rem, 1.3vw, 0.85rem);
  line-height: 1.85;
  color: var(--ink);
}

/* ════════════════════════════════════════════
   WORK PANEL — the "window" that rises on the
   final section, holding the portfolio carousel
   ════════════════════════════════════════════ */
#work-panel {
  position: fixed;
  z-index: 15;
  right: var(--pad);
  top: calc(5.5rem + clamp(1rem, 3vh, 2rem));
  bottom: calc(5rem + clamp(1rem, 3vh, 2rem));
  width: min(600px, 46vw);
  display: flex; flex-direction: column;
  background: #FFFFFF;
  border: 1px solid rgba(17,17,17,0.14);
  box-shadow: 0 30px 80px -20px rgba(17,17,17,0.18);
  transform: translateY(calc(100% + 8rem));
  transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
  overflow: hidden;
}
#work-panel.open { transform: none; pointer-events: auto; }

.wp-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.9rem 1.1rem;
  border-bottom: 1px solid var(--hairline);
  flex: none;
}
.wp-title {
  font-size: 0.58rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gray);
  display: flex; align-items: center; gap: 0.55em;
}
.wp-title::before {
  content: '';
  width: 0.55rem; height: 0.55rem;
  clip-path: var(--t-mark);
  background: var(--accent);
  flex: none;
}
.wp-counter {
  font-size: 0.58rem;
  letter-spacing: 0.18em;
  color: var(--gray);
  font-variant-numeric: tabular-nums;
}

/* Carousel track */
#work-track {
  flex: 1;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;          /* Firefox */
}
#work-track::-webkit-scrollbar { display: none; }

.work-slide {
  flex: none;
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  display: flex; flex-direction: column;
  padding: 1.1rem;
  gap: 0.8rem;
}
.work-slide video {
  width: 100%;
  flex: 1;
  min-height: 0;
  object-fit: cover;
  background: var(--paper);
  border: 1px solid var(--hairline);
  display: block;
  border-radius: 2px;
}
.work-meta { flex: none; display: flex; justify-content: space-between; align-items: baseline; }
.work-name {
  font-family: 'Futura Now Headline', sans-serif;
  font-weight: 700;
  font-size: clamp(1rem, 1.8vw, 1.4rem);
  line-height: 1;
}
.work-tag {
  font-size: 0.55rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gray);
}

/* Carousel controls */
.wp-foot {
  flex: none;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.8rem 1.1rem;
  border-top: 1px solid var(--hairline);
}
.wp-hint { font-size: 0.52rem; letter-spacing: 0.15em; color: var(--gray); text-transform: uppercase; }
.wp-btns { display: flex; gap: 0.5rem; }
.wp-btn {
  width: 2.1rem; height: 2.1rem;
  border: 1px solid rgba(17,17,17,0.2);
  background: transparent;
  color: var(--black);
  font-family: inherit;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.25s, border-color 0.25s;
}
.wp-btn:hover { background: var(--accent); border-color: transparent; }

/* ══════════════════════════════
   RESPONSIVE BREAKPOINTS
   ══════════════════════════════ */

/* Tablet — text col slightly wider */
@media (max-width: 900px) {
  #content { grid-template-columns: minmax(0, 65%) 1fr; }
  #face-text { width: min(100%, 60vw); }
  #work-panel { width: min(520px, 60vw); }
}

/* Mobile — single column; work panel becomes a bottom sheet */
@media (max-width: 600px) {
  #content { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  #face-index, #spacer { grid-column: 1; }
  #face-text { grid-column: 1; width: 100%; padding-right: 1rem; }
  #fi-title { font-size: clamp(2.8rem, 14vw, 4.5rem); max-width: 100%; }
  .fblock-body { font-size: 0.75rem; line-height: 1.8; }

  #work-panel {
    left: 0.75rem; right: 0.75rem;
    width: auto;
    top: auto;
    height: min(64vh, 30rem);
    bottom: calc(5rem + 0.75rem);
  }
}
</style>
</head>

};

const PALETTE     = [0xFBAE9C, 0x81CFE3, 0xFFC718, 0x2F77B1, 0xE02727, 0x2A7928];
const PALETTE_CSS = ["#FBAE9C", "#81CFE3", "#FFC718", "#2F77B1", "#E02727", "#2A7928"];

// ════════════════════════════════════════════════════
//  PORTFOLIO DATA — swap the src paths for real files.
//  Posters are generated brand-color placeholders; you
//  can also point `poster:` at real thumbnails.
// ════════════════════════════════════════════════════
const PORTFOLIO = [
  { name: "Brand Ident",     tag: "Motion / 2026", src: "assets/portfolio/work-01.mp4" },
  { name: "Title Sequence",  tag: "Film / 2026",   src: "assets/portfolio/work-02.mp4" },
  { name: "VFX Breakdown",   tag: "VFX / 2025",    src: "assets/portfolio/work-03.mp4" },
  { name: "Motion Study",    tag: "R&D / 2025",    src: "assets/portfolio/work-04.mp4" },
  { name: "Commercial",      tag: "Broadcast / 2025", src: "assets/portfolio/work-05.mp4" },
  { name: "Show Package",    tag: "Broadcast / 2024", src: "assets/portfolio/work-06.mp4" }
];

// Placeholder poster: brand color field + white T mark + index
function makePoster(colorCss, i) {
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">` +
    `<rect width="800" height="450" fill="${colorCss}"/>` +
    `<path fill="rgba(255,255,255,0.92)" transform="translate(355,140) scale(0.9)" ` +
    `d="M32 0 H68 V63 L100 82 V150 H0 V82 L32 63 Z"/>` +
    `<text x="400" y="330" text-anchor="middle" font-family="monospace" font-size="20" ` +
    `letter-spacing="6" fill="rgba(255,255,255,0.9)">0${i + 1}</text>` +
    `</svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

// ════════════════════════════════════════════════════
//  BUILD DOM
// ════════════════════════════════════════════════════
const dotsEl   = document.getElementById('dots');
const faceText = document.getElementById('face-text');
const fiTitle  = document.getElementById('fi-title');
const panel    = document.getElementById('work-panel');
const track    = document.getElementById('work-track');
const counter  = document.getElementById('wp-counter');
const dotEls   = [];
const blockEls = [];

FACES.forEach((f, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => jumpTo(i));
  dotsEl.appendChild(d);
  dotEls.push(d);

  const b = document.createElement('div');
  b.className = 'fblock' + (i === 0 ? ' visible' : '');
  b.innerHTML = `<div class="fblock-body">${f.body}</div>`;
  faceText.appendChild(b);
  blockEls.push(b);
});

// Portfolio slides
PORTFOLIO.forEach((p, i) => {
  const slide = document.createElement('div');
  slide.className = 'work-slide';
  slide.innerHTML =
    `<video controls playsinline preload="none" poster="${makePoster(PALETTE_CSS[i % 6], i)}">` +
    `<source src="${p.src}" type="video/mp4"></video>` +
    `<div class="work-meta"><div class="work-name">${p.name}</div>` +
    `<div class="work-tag">${p.tag}</div></div>`;
  track.appendChild(slide);
});
const videos = track.querySelectorAll('video');

// Carousel navigation
let slideIdx = 0;
function goToSlide(i) {
  slideIdx = Math.max(0, Math.min(PORTFOLIO.length - 1, i));
  track.scrollTo({ left: slideIdx * track.clientWidth, behavior: 'smooth' });
}
document.getElementById('wp-prev').addEventListener('click', () => goToSlide(slideIdx - 1));
document.getElementById('wp-next').addEventListener('click', () => goToSlide(slideIdx + 1));

track.addEventListener('scroll', () => {
  const i = Math.round(track.scrollLeft / track.clientWidth);
  if (i !== slideIdx) {
    slideIdx = i;
    counter.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(PORTFOLIO.length).padStart(2, '0');
  }
}, { passive: true });

const WORK_IDX = FACES.length - 1;
let currentFaceIdx = 0;

function setFace(idx) {
  if (idx === currentFaceIdx) return;
  currentFaceIdx = idx;
  dotEls.forEach((d, i)   => d.classList.toggle('active',  i === idx));
  blockEls.forEach((b, i) => b.classList.toggle('visible', i === idx));
  const f = FACES[idx];
  fiTitle.innerHTML = f.title.replace(/\n/g, '<br>');
  document.documentElement.style.setProperty('--accent', `var(${f.accent})`);
  targetIconColor.setHex(idx === WORK_IDX ? 0x111111 : ACCENT_HEX[f.accent]);

  // Portfolio window rises on the final face
  const isWork = idx === WORK_IDX;
  panel.classList.toggle('open', isWork);
  panel.setAttribute('aria-hidden', String(!isWork));
  if (!isWork) videos.forEach(v => v.pause());
}

// ════════════════════════════════════════════════════
//  THREE.JS — SCENE
// ════════════════════════════════════════════════════
const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.2, 8.5);

// ── LIGHTING — tuned for a flat "painted" cel look, not realism.
// A soft key sets the toon light direction; generous ambient lifts the
// shadow band so the flat brand colours stay legible on pure white.
scene.add(new THREE.AmbientLight(0xffffff, 0.60));
const key = new THREE.DirectionalLight(0xffffff, 0.90);
key.position.set(-3, 5, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.28);
fill.position.set(4, 1, 3);
scene.add(fill);

const targetIconColor = new THREE.Color(0xFBAE9C);

// ════════════════════════════════════════════════════
//  THE MARK IN 3D — a smooth extrusion of the actual
//  topper icon. We take the exact SVG silhouette of the
//  logo, give it depth with a soft rounded bevel, and
//  spin it about the vertical (up) axis like a turntable
//  so each colour face swings past you as you scroll.
// ════════════════════════════════════════════════════

// Trace of assets/topper_icon.svg mapped into 3D space.
// SVG is Y-down; we flip Y and recentre so the mark stands
// upright and revolves about its own middle.
const SVG_CX = 420.94, SVG_CY = 292.735, SVG_S = 0.0097;
const MX = x => (x - SVG_CX) * SVG_S;
const MY = y => -(y - SVG_CY) * SVG_S;

function markShape() {
  const s = new THREE.Shape();
  s.moveTo(MX(473.57), MY(310.52));
  s.lineTo(MX(473.57), MY(189.74));
  s.lineTo(MX(368.32), MY(189.74));
  s.lineTo(MX(368.32), MY(310.52));
  s.bezierCurveTo(MX(368.32), MY(314.36), MX(364.84), MY(317.26), MX(361.06), MY(316.57));
  s.lineTo(MX(322.26), MY(309.46));
  s.bezierCurveTo(MX(318.48), MY(308.77), MX(315.00), MY(311.67), MX(315.00), MY(315.51));
  s.lineTo(MX(315.00), MY(395.73));
  s.lineTo(MX(526.88), MY(395.73));
  s.lineTo(MX(526.88), MY(315.51));
  s.bezierCurveTo(MX(526.88), MY(311.67), MX(523.40), MY(308.77), MX(519.62), MY(309.46));
  s.lineTo(MX(480.82), MY(316.57));
  s.bezierCurveTo(MX(477.04), MY(317.26), MX(473.56), MY(314.36), MX(473.56), MY(310.52));
  s.closePath();
  return s;
}

// Smooth solid: the extruded logo with a soft bevelled edge
// that catches the toon light. Centred on all axes so it
// revolves cleanly about its own middle.
const markGeo = new THREE.ExtrudeGeometry(markShape(), {
  depth:          0.34,
  bevelEnabled:   true,
  bevelThickness: 0.05,
  bevelSize:      0.045,
  bevelSegments:  4,
  curveSegments:  24
});
markGeo.center();

// ════════════════════════════════════════════════════
//  HALFTONE SHADER — the "paint" stays a flat brand
//  colour, but the shadows and highlights are rendered as
//  screen-space halftone dots (ben-day / comic screentone)
//  instead of smooth or cel banding. Darker dots deepen
//  the shadow side; white dots sparkle the lit side. The
//  dot grid is fixed in screen space, so the pattern reads
//  like print as the mark turns beneath it.
// ════════════════════════════════════════════════════
const halftoneMats = [];
function makeHalftoneMaterial(hex) {
  const m = new THREE.ShaderMaterial({
    extensions: { derivatives: true },   // fwidth() for crisp dot edges (WebGL1)
    uniforms: {
      uColor:      { value: new THREE.Color(hex) },
      uDotPx:      { value: 5.0 * renderer.getPixelRatio() }, // dot spacing, device px
      uHalfHeight: { value: 1.05 },                            // model half-height
      uLightA:     { value: new THREE.Vector3(-3, 5, 6) },     // key direction
      uLightB:     { value: new THREE.Vector3( 4, 1, 3) },     // fill direction
      uAmbient:    { value: 0.22 }
    },
    vertexShader: `
      varying vec3  vN;
      varying float vH;
      void main() {
        vN = normalize(mat3(modelMatrix) * normal);  // world normal (uniform scale)
        vH = position.y;                             // object-space height for tonal ramp
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      precision highp float;
      uniform vec3  uColor;
      uniform float uDotPx, uHalfHeight, uAmbient;
      uniform vec3  uLightA, uLightB;
      varying vec3  vN;
      varying float vH;

      // Screen-space halftone dot mask for a given coverage
      // (0 = no dot, 1 = solid). angle keeps the two grids from aligning.
      float halftone(vec2 fc, float angleDeg, float sizePx, float coverage) {
        if (coverage <= 0.001) return 0.0;
        float a = radians(angleDeg);
        mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
        vec2 p    = (R * fc) / sizePx;
        vec2 cell = fract(p) - 0.5;
        float d   = length(cell) * 2.0;        // 0 at centre → ~1.414 at corner
        float r   = coverage * 1.5;            // dot radius grows with coverage
        float aa  = fwidth(d) + 0.02;
        return 1.0 - smoothstep(r - aa, r + aa, d);
      }

      void main() {
        vec3  N = normalize(vN);
        float diffKey  = max(dot(N, normalize(uLightA)), 0.0);
        float diffFill = max(dot(N, normalize(uLightB)), 0.0);

        // Keep the tone centred so the visible face carries BOTH bands at
        // once — highlight dots up top, shadow dots below — a real halftone
        // gradient rather than one flat mid-tone.
        float lit = uAmbient + 0.30 * diffKey + 0.10 * diffFill;
        lit += (vH / uHalfHeight) * 0.18;      // top-lit ramp → dot gradient across flat faces
        lit  = clamp(lit, 0.0, 1.0);

        vec3 base   = uColor;
        vec3 shadow = uColor * 0.45;           // darker ink, same hue → stronger contrast

        // Peak coverage capped so the densest dots stay separated
        // (radius tops out ~0.9 in cell units) — dense, but never a blob.
        const float MAX_COV = 0.60;
        float shadowCov = smoothstep(0.48, 0.10, lit) * MAX_COV;   // narrow dead zone at ~0.5
        float highCov   = smoothstep(0.52, 0.90, lit) * MAX_COV;

        vec3 col = base;
        col = mix(col, shadow,    halftone(gl_FragCoord.xy, 18.0, uDotPx, shadowCov));
        col = mix(col, vec3(1.0), halftone(gl_FragCoord.xy, 72.0, uDotPx, highCov) * 0.8);

        gl_FragColor = vec4(col, 1.0);         // solid alpha → clean silhouette mask
      }`
  });
  halftoneMats.push(m);
  return m;
}

// One mark = a single solid mesh painted by the halftone shader.
// No geometry-based outline: the silhouette line is drawn in screen
// space at compositing time, so it only ever appears where the model
// meets the background — never on an interior edge.
function buildMark(material) {
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(markGeo, material));
  return grp;
}

const sculpture = new THREE.Group();
scene.add(sculpture);

// Hero mark — nested groups: heroSpin turns about the vertical
// axis inside heroGroup, which only carries scale/placement.
// Its paint colour animates toward the active section accent,
// so every quarter-turn to a new section reveals a new palette hue.
const heroMat   = makeHalftoneMaterial(0xFBAE9C);
const heroColor = new THREE.Color(0xFBAE9C);   // JS-side colour, lerped → uColor
const heroSpin  = buildMark(heroMat);
const heroGroup = new THREE.Group();
heroGroup.scale.setScalar(1.25);
heroGroup.add(heroSpin);
sculpture.add(heroGroup);

// Base pose — slight forward tilt so the mark reads with depth
const BASE_X = 0.16, BASE_Y = -0.12, BASE_Z = 0;
sculpture.rotation.set(BASE_X, BASE_Y, BASE_Z);

// Position model toward the right half of the screen on desktop
function positionSculpture() {
  const isMobile = window.innerWidth <= 600;
  const isTablet = window.innerWidth <= 900 && !isMobile;
  sculpture.position.x = isMobile ? 0.3 : isTablet ? 0.8 : 1.6;
  sculpture.position.y = isMobile ? 0.4 : 0.05;
}
positionSculpture();

// ════════════════════════════════════════════════════
//  SILHOUETTE OUTLINE — screen space, background-only.
//  The scene is rendered to an offscreen buffer, then a
//  fullscreen pass draws a black line ONLY where the
//  model's coverage (alpha) borders the transparent
//  background. Interior faces are all fully covered, so no
//  line can ever appear inside the model — it exists purely
//  to separate the paint from the white page.
// ════════════════════════════════════════════════════
const OUTLINE_PX = 3.4;   // outline width in CSS px
function makeRT() {
  const pr = renderer.getPixelRatio();
  return new THREE.WebGLRenderTarget(
    Math.max(2, Math.floor(window.innerWidth  * pr)),
    Math.max(2, Math.floor(window.innerHeight * pr)),
    { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat }
  );
}
let sceneRT = makeRT();

const fsCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsScene = new THREE.Scene();
const composeMat = new THREE.ShaderMaterial({
  transparent: true,
  depthTest: false,
  depthWrite: false,
  uniforms: {
    tScene: { value: sceneRT.texture },
    uTexel: { value: new THREE.Vector2(1 / sceneRT.width, 1 / sceneRT.height) },
    uThick: { value: OUTLINE_PX * renderer.getPixelRatio() },
    uInk:   { value: new THREE.Color(0x111111) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tScene;
    uniform vec2  uTexel;
    uniform float uThick;
    uniform vec3  uInk;
    varying vec2  vUv;
    void main() {
      vec4 c = texture2D(tScene, vUv);
      if (c.a > 0.5) { gl_FragColor = c; return; }   // inside the model → keep shading
      // background pixel: is the model within uThick? then it's the border.
      float near = 0.0;
      for (int i = 0; i < 16; i++) {
        float t = 6.2831853 * float(i) / 16.0;
        vec2  o = vec2(cos(t), sin(t)) * uThick * uTexel;
        near = max(near, texture2D(tScene, vUv + o).a);
      }
      if (near > 0.5) gl_FragColor = vec4(uInk, 1.0);  // ink line hugging the silhouette
      else discard;                                     // stays transparent → page shows
    }`
});
const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), composeMat);
fsQuad.frustumCulled = false;
fsScene.add(fsQuad);

function resizeRT() {
  const pr = renderer.getPixelRatio();
  sceneRT.setSize(Math.max(2, Math.floor(window.innerWidth  * pr)),
                  Math.max(2, Math.floor(window.innerHeight * pr)));
  composeMat.uniforms.uTexel.value.set(1 / sceneRT.width, 1 / sceneRT.height);
  composeMat.uniforms.uThick.value = OUTLINE_PX * pr;
  halftoneMats.forEach(m => { m.uniforms.uDotPx.value = 5.0 * pr; });
}

function renderFrame() {
  renderer.setRenderTarget(sceneRT);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(fsScene, fsCam);
}

// One full turn per section, so the mark lands facing front —
// showing off a fresh palette colour — at every stop.
const TOTAL_ROTATION = Math.PI * 2 * (FACES.length - 1);

let progress   = 0;
let targetProg = 0;
let targetDepth = 0;      // sculpture recedes when the work panel is open
let depth       = 0;

let hoverX = 0, hoverY = 0;

let touching    = false;
let touchStartY = 0;
let progAtTouch = 0;

const DRAG_PX = () => window.innerHeight * 2.2;
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function applyProgress(p) {
  progress = p;
  const idx = Math.min(FACES.length - 1, Math.round(p * (FACES.length - 1)));
  setFace(idx);
  targetDepth = (idx === WORK_IDX) ? -3.2 : 0;
}

// Wheel — attached to window so it keeps working when the work panel
// overlays the canvas. VERTICAL wheel ALWAYS navigates sections, so you
// can always scroll back up. Only a clearly-horizontal gesture over the
// reel scrubs the carousel (trackpad swipe / shift-wheel).
window.addEventListener('wheel', (e) => {
  const overReel   = e.target.closest && e.target.closest('#work-track');
  const horizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY);
  if (overReel && horizontal) {
    e.preventDefault();
    track.scrollLeft += e.deltaX;
    return;
  }
  e.preventDefault();
  const delta = e.deltaMode === 1 ? e.deltaY * 0.05 : e.deltaY * 0.0004;
  targetProg = clamp01(targetProg + delta);
}, { passive: false });

// Unified drag — Pointer Events cover mouse, touch, and pen
canvas.addEventListener('pointerdown', (e) => {
  touching    = true;
  touchStartY = e.clientY;
  progAtTouch = targetProg;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (touching) {
    targetProg = clamp01(progAtTouch + (touchStartY - e.clientY) / DRAG_PX());
  } else if (e.pointerType === 'mouse' && !REDUCED_MOTION) {
    hoverX = (e.clientX / window.innerWidth  - 0.5) * 0.3;
    hoverY = (e.clientY / window.innerHeight - 0.5) * 0.3;
  }
});

canvas.addEventListener('pointerup',     () => { touching = false; });
canvas.addEventListener('pointercancel', () => { touching = false; });

// Keyboard — Up/Down step sections; Left/Right drive the reel when open
window.addEventListener('keydown', (e) => {
  const panelOpen = currentFaceIdx === WORK_IDX;
  if (e.key === 'ArrowDown' || (!panelOpen && e.key === 'ArrowRight')) {
    jumpTo(Math.min(FACES.length - 1, currentFaceIdx + 1));
  } else if (e.key === 'ArrowUp' || (!panelOpen && e.key === 'ArrowLeft')) {
    jumpTo(Math.max(0, currentFaceIdx - 1));
  } else if (panelOpen && e.key === 'ArrowRight') {
    goToSlide(slideIdx + 1);
  } else if (panelOpen && e.key === 'ArrowLeft') {
    goToSlide(slideIdx - 1);
  }
});

function jumpTo(idx) {
  targetProg = idx / (FACES.length - 1);
}

// Resize — debounced so rapid resize events don't thrash the renderer
let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    resizeRT();
    positionSculpture();
    needsRender = true;
  }, 100);
});

// ════════════════════════════════════════════════════
//  RENDER LOOP — renders only while something is moving.
//  Once progress, colors, depth, and parallax settle, the
//  GPU goes idle. Any interaction wakes it instantly.
// ════════════════════════════════════════════════════
let needsRender = true;
let lastHX = 0, lastHY = 0;

function colorSettled(c, t) {
  return Math.abs(c.r - t.r) < 0.002 && Math.abs(c.g - t.g) < 0.002 && Math.abs(c.b - t.b) < 0.002;
}

function animate() {
  requestAnimationFrame(animate);

  // Smooth progress toward target
  const smoothed = progress + (targetProg - progress) * 0.08;
  if (Math.abs(smoothed - progress) > 0.00001) {
    applyProgress(smoothed);
    needsRender = true;
  }

  // Hero paint colour drifts toward the active section accent
  if (!colorSettled(heroColor, targetIconColor)) {
    heroColor.lerp(targetIconColor, 0.07);
    if (colorSettled(heroColor, targetIconColor)) heroColor.copy(targetIconColor);
    heroMat.uniforms.uColor.value.copy(heroColor);
    needsRender = true;
  }

  // Sculpture recedes behind the work panel
  if (Math.abs(depth - targetDepth) > 0.001) {
    depth += (targetDepth - depth) * 0.06;
    needsRender = true;
  }

  // Parallax changed?
  if (hoverX !== lastHX || hoverY !== lastHY) {
    lastHX = hoverX; lastHY = hoverY;
    needsRender = true;
  }

  if (needsRender) {
    // The mark turns about the vertical (up) axis — like a logo on
    // a slow turntable — so its painted face sweeps toward you as
    // you scroll, landing front-on with a new colour each section.
    heroSpin.rotation.y = -TOTAL_ROTATION * progress;
    sculpture.rotation.x = BASE_X + hoverY * 0.6;
    sculpture.rotation.y = BASE_Y + hoverX;
    sculpture.rotation.z = BASE_Z;
    sculpture.position.z = depth;
    renderFrame();
    needsRender = false;
  }
}

applyProgress(0);
animate();
</script>
</body>
</html>
